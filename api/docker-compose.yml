services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: maslul
      POSTGRES_USER: maslul
      POSTGRES_PASSWORD: maslul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
