services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: maslul
      # Bootstrap identity only. The app connects as the non-superuser "maslul" role
      # created by the init script below - see that script for why this matters.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Mount the file, not the directory - the postgis/postgis image ships its own
      # scripts in /docker-entrypoint-initdb.d (they install the postgis extensions);
      # mounting a directory over that path would hide them entirely.
      - ./app/src/test/resources/db/postgres-init/01-create-app-role.sql:/docker-entrypoint-initdb.d/01-create-app-role.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
